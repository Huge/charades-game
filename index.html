<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Charades</title>
<meta name="description" content="A party charades game: movies, animals, actions, jobs, food, sports and famous people. One acts or describes, the rest guess before the timer runs out.">
<meta name="theme-color" content="#0d0e1c">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
<style>
:root{
  --bg:#0d0e1c; --panel:#191b33; --line:#2e3260;
  --ink:#f4f1e8; --muted:#a6a9c6;
  --gold:#ffc940; --gold-ink:#241a00;
  --ok:#2ecc7a; --ok-ink:#03200f;
  --bad:#ff5d5d;
  --card:#fff6df; --card-ink:#1a1630;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(900px 520px at 50% -120px,#2c2f66 0%,transparent 70%),var(--bg);
  background-attachment:fixed;
  color:var(--ink);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;
}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{
  min-height:100dvh;max-width:640px;margin:0 auto;display:flex;flex-direction:column;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
}
.screen{flex:1;display:flex;flex-direction:column;gap:16px;min-height:0}

/* shared */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:56px;padding:12px 20px;border-radius:16px;
  font-weight:800;font-size:1.1rem;letter-spacing:.01em;
  transition:transform .08s ease,filter .15s ease;
}
.btn:active{transform:scale(.97)}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.ok{background:var(--ok);color:var(--ok-ink)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.big{min-height:84px;font-size:1.4rem}
#startBtn{position:sticky;bottom:max(8px,env(safe-area-inset-bottom));z-index:2;box-shadow:0 0 0 10px var(--bg)}
.link{color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:8px;align-self:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
.label{font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.spacer{flex:1}

/* home */
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{
  display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 14px;border-radius:999px;
  font-weight:700;font-size:.9rem;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line);
}
.pill[aria-pressed="true"]{color:var(--ink)}
.marquee{
  text-align:center;padding:22px 14px;border-radius:22px;
  border:4px dotted var(--gold);
  background:linear-gradient(180deg,#22254a,#171930);
}
.marquee h1{
  margin:0;font-size:clamp(2rem,9vw,3.4rem);line-height:1.02;font-weight:900;
  letter-spacing:.04em;text-transform:uppercase;color:var(--gold);
  text-shadow:0 0 22px rgba(255,201,64,.35);
  text-wrap:balance;
}
.marquee p{margin:10px 0 0;color:var(--muted);text-wrap:balance}
.how{margin:0;padding:0 0 0 1.25em;color:var(--muted);font-size:.95rem}
.how li{margin:4px 0}
.how li::marker{color:var(--gold);font-weight:800}
.opts{display:flex;flex-direction:column;gap:16px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:#111328;border-radius:14px;padding:5px}
.seg button{min-height:46px;border-radius:10px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.seg button[aria-checked="true"]{background:var(--gold);color:var(--gold-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  min-height:44px;padding:8px 14px;border-radius:999px;font-weight:700;font-size:.95rem;
  color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line);
}
.chip[aria-pressed="true"]{background:rgba(255,201,64,.14);color:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold)}
.chip small{font-weight:600;opacity:.75;margin-left:4px}
.note{color:var(--muted);font-size:.85rem;margin:8px 0 0}

/* scoreboard */
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.board li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#111328}
.board li.now{box-shadow:inset 0 0 0 2px var(--gold)}
.board .dot{width:12px;height:12px;border-radius:50%;flex:none}
.board .name{flex:1;font-weight:700}
.board .pts{font-weight:900;font-size:1.25rem;font-variant-numeric:tabular-nums}

/* ready */
#ready{align-items:center;justify-content:center;text-align:center}
#ready h2{margin:0;font-size:clamp(2.2rem,11vw,4rem);font-weight:900;color:var(--gold);line-height:1.05}
#ready p{margin:0;color:var(--muted);max-width:26ch;font-size:1.1rem;text-wrap:balance}
#ready .btn{min-width:min(100%,280px)}
#count{font-size:clamp(7rem,40vw,13rem);font-weight:900;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}

/* play */
.bar{height:10px;border-radius:999px;background:#111328;overflow:hidden;flex:none}
.bar i{display:block;height:100%;background:var(--gold);transform-origin:left;transition:transform .1s linear,background-color .3s}
.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;flex:none}
.hud .got{font-weight:800;color:var(--ok);font-size:1.2rem;font-variant-numeric:tabular-nums}
.hud .who{font-size:.8rem;color:var(--muted);font-weight:700;display:block}
#clock{font-size:clamp(3.2rem,16vw,5rem);font-weight:900;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hud .pause{justify-self:end;width:48px;height:48px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);font-size:1.1rem;color:var(--muted)}
#play.low #clock{color:var(--bad)}
#play.low .bar i{background:var(--bad)}
.card{
  flex:1;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:var(--card);color:var(--card-ink);border-radius:26px;padding:24px 20px;text-align:center;
  box-shadow:0 0 0 4px var(--bg),0 0 0 8px var(--gold),0 24px 60px rgba(0,0,0,.45);
  margin:8px;
}
.card .kind{font-size:.75rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#8a7a52}
#movie{
  margin:0;font-size:clamp(1.9rem,8.5vw,3.6rem);line-height:1.08;font-weight:900;
  text-wrap:balance;overflow-wrap:anywhere;
}
#movie.in{animation:pop .22s ease-out}
.actions{display:grid;grid-template-columns:1fr 1.6fr;gap:12px;flex:none}
#veil{
  position:fixed;inset:0;z-index:5;background:rgba(13,14,28,.96);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;
}
#veil h2{margin:0 0 8px;font-size:2.2rem;font-weight:900}
#veil .btn{width:min(100%,300px)}

/* done */
#done h2{margin:0;font-size:clamp(2rem,9vw,3rem);font-weight:900;color:var(--gold);text-align:center;line-height:1.1}
.tally{text-align:center;font-size:1.3rem;font-weight:800;margin:0}
.tally b{color:var(--ok);font-size:2.2rem;font-variant-numeric:tabular-nums;vertical-align:-.08em;margin-left:4px}
.res{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.res button{
  width:100%;display:flex;align-items:center;gap:12px;text-align:left;min-height:46px;padding:8px 12px;
  border-radius:12px;background:#111328;font-weight:600;
}
.res .mark{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:.9rem;flex:none;background:#2a2d52;color:var(--muted)}
.res .yes .mark{background:var(--ok);color:var(--ok-ink)}
.res .no{color:var(--muted)}
.row{display:grid;grid-template-columns:1fr 2fr;gap:12px}

@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{50%{transform:scale(1.08)}}
#play.low #clock{animation:pulse 1s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){
  #movie.in,#play.low #clock{animation:none}
  .bar i,.btn{transition:none}
}
@media (orientation:landscape) and (max-height:480px){
  .card{min-height:110px;padding:12px 16px;margin:4px 8px}
  #movie{font-size:clamp(1.6rem,6vw,2.6rem)}
  #clock{font-size:2.6rem}
  .btn.big{min-height:60px}
  .screen{gap:10px}
}
</style>
</head>
<body>
<main id="app">

  <!-- HOME -->
  <section id="home" class="screen">
    <div class="top">
      <button class="pill" id="soundBtn" aria-pressed="true"></button>
      <button class="pill" id="langBtn" aria-label="Language / Jazyk"></button>
    </div>
    <header class="marquee">
      <h1 data-t="title"></h1>
      <p data-t="tagline"></p>
    </header>
    <ol class="how">
      <li data-t="how1"></li>
      <li data-t="how2"></li>
      <li data-t="how3"></li>
    </ol>
    <div class="panel opts">
      <div>
        <p class="label" id="lblTimer" data-t="timer"></p>
        <div class="seg" id="timeSeg" role="radiogroup" aria-labelledby="lblTimer"></div>
      </div>
      <div>
        <p class="label" id="lblTeams" data-t="teams"></p>
        <div class="seg" id="teamSeg" role="radiogroup" aria-labelledby="lblTeams"></div>
      </div>
      <div>
        <p class="label" data-t="decks"></p>
        <div class="chips" id="deckChips"></div>
        <p class="note" id="poolNote"></p>
      </div>
    </div>
    <div class="panel" id="homeBoardWrap" hidden>
      <p class="label" data-t="scores"></p>
      <ul class="board" id="homeBoard"></ul>
    </div>
    <div class="spacer"></div>
    <button class="btn gold big" id="startBtn"></button>
    <button class="link" id="resetBtn" data-t="reset" hidden></button>
  </section>

  <!-- READY -->
  <section id="ready" class="screen" hidden>
    <h2 id="readyTeam"></h2>
    <p id="readyHint" data-t="readyHint"></p>
    <div id="count" hidden aria-live="assertive"></div>
    <button class="btn gold big" id="goBtn" data-t="go"></button>
    <button class="link" id="backBtn" data-t="back"></button>
  </section>

  <!-- PLAY -->
  <section id="play" class="screen" hidden>
    <div class="bar"><i id="barFill"></i></div>
    <div class="hud">
      <div><span class="who" id="playWho"></span><span class="got">✓ <span id="gotN">0</span></span></div>
      <div id="clock" role="timer">1:00</div>
      <button class="pause" id="pauseBtn" aria-label="Pause">❚❚</button>
    </div>
    <div class="card">
      <span class="kind" id="kind"></span>
      <h2 id="movie" aria-live="polite"></h2>
    </div>
    <div class="actions">
      <button class="btn ghost big" id="skipBtn" data-t="skip"></button>
      <button class="btn ok big" id="okBtn" data-t="guessed"></button>
    </div>
    <div id="veil" hidden>
      <h2 data-t="paused"></h2>
      <button class="btn gold" id="resumeBtn" data-t="resume"></button>
      <button class="btn ghost" id="endBtn" data-t="endRound"></button>
    </div>
  </section>

  <!-- DONE -->
  <section id="done" class="screen" hidden>
    <h2 data-t="timeUp"></h2>
    <p class="tally"><span id="doneWho"></span> <span data-t="roundScore"></span><b id="doneN">0</b></p>
    <div class="panel">
      <ul class="res" id="resList"></ul>
      <p class="note" data-t="fixHint"></p>
    </div>
    <div class="panel" id="doneBoardWrap">
      <p class="label" data-t="scores"></p>
      <ul class="board" id="doneBoard"></ul>
    </div>
    <div class="spacer"></div>
    <div class="row">
      <button class="btn ghost" id="menuBtn" data-t="menu"></button>
      <button class="btn gold" id="nextBtn"></button>
    </div>
  </section>

  <noscript><p style="padding:24px;text-align:center">This game needs JavaScript. / Hra potřebuje JavaScript.</p></noscript>
</main>

const seen = new Set(store.get("gf.seen", []) || []);
const save = () => store.set("gf.state", S);
const t = (k, a) => (TEXT[S.lang][k] || k).replace("{0}", a);
const teamName = i => t("team", i + 1);
const titleOf = m => S.lang === "cs" ? m.cs : m.en;
const fmt = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");

let R = null;          // current round
let cdTimer = null;    // 3-2-1 countdown

/* ---------- Sound, vibration, wake lock ---------- */
let ac = null;
function beep(freq, dur, type, vol) {
  if (!S.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
    const o = ac.createOscillator(), g = ac.createGain(), now = ac.currentTime;
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.18, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(now); o.stop(now + dur);
  } catch (e) { /* no audio */ }
}
let wl = null;
async function wake() { try { if (navigator.wakeLock) wl = await navigator.wakeLock.request("screen"); } catch (e) { /* denied */ } }
function unwake() { try { if (wl) wl.release(); } catch (e) { /* ignore */ } wl = null; }
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && R && !R.over) wake();
});

/* ---------- Screens ---------- */
function show(id) {
  ["home", "ready", "play", "done"].forEach(s => { $(s).hidden = s !== id; });
  window.scrollTo(0, 0);
}
function applyTexts() {
  document.documentElement.lang = S.lang;
  document.title = t("title");
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
}
function seg(el, opts, cur, onPick) {
  el.textContent = "";
  opts.forEach(([v, label]) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label;
    b.setAttribute("role", "radio"); b.setAttribute("aria-checked", String(v === cur));
    b.onclick = () => onPick(v);
    el.appendChild(b);
  });
}
function board(el, current) {
  el.textContent = "";
  for (let i = 0; i < S.teams; i++) {
    const li = document.createElement("li");
    if (i === current) li.className = "now";
    const dot = document.createElement("span"); dot.className = "dot"; dot.style.background = TEAM_COLORS[i];
    const name = document.createElement("span"); name.className = "name"; name.textContent = teamName(i);
    const pts = document.createElement("span"); pts.className = "pts"; pts.textContent = S.scores[i];
    li.append(dot, name, pts); el.appendChild(li);
  }
}
const inLang = m => !m.only || m.only === S.lang;
const pool = () => MOVIES.filter(m => S.decks.includes(m.deck) && inLang(m));

function renderHome() {
  applyTexts();
  $("langBtn").textContent = S.lang === "cs" ? "🌐 English" : "🌐 Česky";
  $("soundBtn").textContent = t(S.sound ? "soundOn" : "soundOff");
  $("soundBtn").setAttribute("aria-pressed", String(S.sound));
  seg($("timeSeg"), TIMES, S.secs, v => { S.secs = v; save(); renderHome(); });
  seg($("teamSeg"), [1, 2, 3, 4].map(n => [n, String(n)]), S.teams, v => {
    S.teams = v; if (S.turn >= v) S.turn = 0; save(); renderHome();
  });
  const chips = $("deckChips"); chips.textContent = "";
  DECKS.forEach(d => {
    const on = S.decks.includes(d);
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.setAttribute("aria-pressed", String(on));
    b.textContent = DECK_ICON[d] + " " + t("deck_" + d);
    const n = document.createElement("small"); n.textContent = MOVIES.filter(m => m.deck === d && inLang(m)).length;
    b.appendChild(n);
    b.onclick = () => {
      if (on && S.decks.length === 1) return;            // keep at least one deck
      S.decks = on ? S.decks.filter(x => x !== d) : S.decks.concat(d);
      save(); renderHome();
    };
    chips.appendChild(b);
  });
  $("poolNote").textContent = t("pool", pool().length);
  const playing = S.scores.some(n => n > 0);
  $("homeBoardWrap").hidden = !(playing && S.teams > 1);
  if (playing) board($("homeBoard"), S.turn);
  $("resetBtn").hidden = !playing;
  $("startBtn").textContent = t(playing ? "startNext" : "start");
}

/* ---------- Round ---------- */
function toReady() {
  clearInterval(cdTimer);
  $("readyTeam").textContent = S.teams > 1 ? teamName(S.turn) : t("readySolo");
  $("readyTeam").style.color = S.teams > 1 ? TEAM_COLORS[S.turn] : "";
  $("readyTeam").hidden = false; $("readyHint").hidden = false;
  $("count").hidden = true; $("goBtn").hidden = false; $("backBtn").hidden = false;
  show("ready");
}
function countdown() {
  let n = 3;
  $("goBtn").hidden = true; $("readyHint").hidden = true; $("backBtn").hidden = true;
  $("count").hidden = false; $("count").textContent = n;
  beep(520, 0.12);
  clearInterval(cdTimer);
  cdTimer = setInterval(() => {
    n--;
    if (n > 0) { $("count").textContent = n; beep(520, 0.12); }
    else { clearInterval(cdTimer); startRound(); }
  }, 800);
}
function draw() {
  let p = pool().filter(m => !seen.has(keyOf(m)));
  if (!p.length) {                                       // deck used up: start over, minus this round
    seen.clear(); R.items.forEach(i => seen.add(keyOf(i.m)));
    p = pool().filter(m => !seen.has(keyOf(m)));
    if (!p.length) { seen.clear(); p = pool(); }
  }
  const m = p[Math.floor(Math.random() * p.length)];
  seen.add(keyOf(m)); store.set("gf.seen", Array.from(seen));
  return m;
}
function nextCard() {
  R.cur = draw();
  const el = $("movie");
  el.textContent = titleOf(R.cur);
  $("kind").textContent = t("kind_" + KIND[R.cur.deck]);
  el.classList.remove("in"); void el.offsetWidth; el.classList.add("in");
}
function startRound() {
  const total = S.secs * 1000;
  R = { items: [], cur: null, base: S.scores[S.turn], total, deadline: Date.now() + total,
        left: total, paused: false, over: false, lockUntil: 0, lastS: -1, timer: null };
  $("gotN").textContent = "0";
  $("playWho").textContent = S.teams > 1 ? teamName(S.turn) : "";
  $("play").classList.remove("low");
  $("veil").hidden = true;
  show("play");
  nextCard(); wake(); beep(880, 0.25);
  R.timer = setInterval(tick, 100); tick();
}
function tick() {
  if (!R || R.paused || R.over) return;
  const left = Math.max(0, R.deadline - Date.now());
  const s = Math.ceil(left / 1000);
  if (s !== R.lastS) {
    R.lastS = s;
    $("clock").textContent = fmt(s);
    $("play").classList.toggle("low", s <= 10);
    if (s <= 5 && s > 0) beep(660, 0.09, "square", 0.08);
  }
  $("barFill").style.transform = "scaleX(" + (left / R.total) + ")";
  if (left <= 0) endRound();
}
function act(ok) {
  if (!R || R.paused || R.over) return;
  const now = Date.now();
  if (now < R.lockUntil) return;                         // guard against double taps
  R.lockUntil = now + 250;
  R.items.push({ m: R.cur, ok });
  if (ok) { beep(1040, 0.12); $("gotN").textContent = R.items.filter(i => i.ok).length; }
  else beep(300, 0.1, "triangle", 0.12);
  nextCard();
}
function pause() {
  if (!R || R.paused || R.over) return;
  R.paused = true; R.left = Math.max(0, R.deadline - Date.now());
  clearInterval(R.timer);
  $("veil").hidden = false;
}
function resume() {
  if (!R || !R.paused || R.over) return;
  R.paused = false; R.deadline = Date.now() + R.left; R.lastS = -1;
  $("veil").hidden = true;
  R.timer = setInterval(tick, 100); tick();
}
function endRound() {
  if (!R || R.over) return;
  R.over = true; clearInterval(R.timer); unwake();
  if (R.cur) R.items.push({ m: R.cur, ok: null });       // card on screen when time ran out
  beep(220, 0.7, "sawtooth", 0.16);
  try { if (navigator.vibrate) navigator.vibrate([200, 80, 200]); } catch (e) { /* ignore */ }
  renderDone(); show("done");
}
function renderDone() {
  const n = R.items.filter(i => i.ok === true).length;
  S.scores[S.turn] = R.base + n; save();
  $("doneN").textContent = n;
  $("doneWho").textContent = S.teams > 1 ? teamName(S.turn) + " ·" : "";
  const ul = $("resList"); ul.textContent = "";
  R.items.forEach(it => {
    const li = document.createElement("li"), b = document.createElement("button");
    b.type = "button"; b.className = it.ok ? "yes" : "no"; b.setAttribute("aria-pressed", String(!!it.ok));
    const mark = document.createElement("span"); mark.className = "mark";
    mark.textContent = it.ok ? "✓" : it.ok === null ? "⏱" : "✕";
    const name = document.createElement("span"); name.textContent = titleOf(it.m);
    b.append(mark, name);
    b.onclick = () => { it.ok = !it.ok; renderDone(); };
    li.appendChild(b); ul.appendChild(li);
  });
  $("doneBoardWrap").hidden = S.teams < 2;
  if (S.teams > 1) board($("doneBoard"), S.turn);
  const nxt = (S.turn + 1) % S.teams;
  $("nextBtn").textContent = S.teams > 1 ? t("nextTeam", teamName(nxt)) : t("nextRound");
}
function closeRound() { S.turn = (S.turn + 1) % S.teams; save(); R = null; }

/* ---------- Wiring ---------- */
const tap = (id, fn) => $(id).addEventListener("click", e => { e.currentTarget.blur(); fn(e); });
tap("langBtn", () => { S.lang = S.lang === "cs" ? "en" : "cs"; save(); renderHome(); });
tap("soundBtn", () => { S.sound = !S.sound; save(); renderHome(); if (S.sound) beep(880, 0.1); });
tap("startBtn", toReady);
tap("resetBtn", () => { S.scores = [0, 0, 0, 0]; S.turn = 0; save(); renderHome(); });
tap("goBtn", countdown);
tap("backBtn", () => { clearInterval(cdTimer); renderHome(); show("home"); });
tap("okBtn", () => act(true));
tap("skipBtn", () => act(false));
tap("pauseBtn", pause);
tap("resumeBtn", resume);
tap("endBtn", () => { $("veil").hidden = true; endRound(); });
tap("nextBtn", () => { closeRound(); toReady(); });
tap("menuBtn", () => { closeRound(); renderHome(); show("home"); });

document.addEventListener("keydown", e => {
  if (e.repeat || $("play").hidden || !R) return;
  const k = e.key;
  if (R.paused) { if (k === "Escape" || k === "p" || k === "P") resume(); return; }
  if (k === "Enter" || k === " " || k === "ArrowRight") { e.preventDefault(); act(true); }
  else if (k === "ArrowLeft" || k === "s" || k === "S") { e.preventDefault(); act(false); }
  else if (k === "Escape" || k === "p" || k === "P") pause();
});

renderHome();
})();
</script>
</body>
</html>
